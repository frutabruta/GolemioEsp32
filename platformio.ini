[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Filesystem: SPIFFS ---
board_build.filesystem = spiffs
; Use a custom minimal-SPIFFS partition table (see section 2)
board_build.partitions = partitions_min_spiffs.csv

; --- Libraries ---
lib_deps =
    bblanchon/ArduinoJson@7.1.0
    https://github.com/olikraus/U8g2_Arduino.git
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; Useful compile defs (optional but commonly handy)
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D WM_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    

; Upload settings (usually auto-detected; override if needed)
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0